[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
categories = ["graphics", "mathematics", "science"]
edition = "2024"
homepage = "https://github.com/andymai/brepkit"
keywords = ["cad", "brep", "geometry", "solid-modeling", "nurbs"]
license = "AGPL-3.0-only"
repository = "https://github.com/andymai/brepkit"
rust-version = "1.88"
# Every crate inherits this via `version.workspace = true`. release-please
# rewrites it, and the `[workspace.dependencies]` versions below, in lockstep.
version = "3.3.2"

[workspace.dependencies]
# Math
robust = "1"

# Error handling
thiserror = "2"

# Logging
env_logger = "0.11"
log = "0.4"

# Serialization
serde = {version = "1", features = ["derive"]}
serde_json = "1"

# Parallelism
rayon = "1.11"

# Collections
bitflags = "2"
smallvec = "1"

# WASM
serde-wasm-bindgen = "0.6"
tsify = {version = "0.5", features = ["js"]}
wasm-bindgen = "=0.2.126"                    # Pinned: must match wasm-bindgen-cli in CI

# Testing
proptest = "1"

# Benchmarking
criterion = {version = "0.8", features = ["html_reports"]}

# IO formats
quick-xml = "0.41"
zip = {version = "8", default-features = false, features = ["deflate"]}

# Workspace crates. The `version` is what consumers resolve from crates.io;
# `path` only overrides it for in-workspace builds and is stripped on publish.
brepkit-algo = {path = "crates/algo", version = "3.3.2"}
brepkit-blend = {path = "crates/blend", version = "3.3.2"}
brepkit-check = {path = "crates/check", version = "3.3.2"}
brepkit-geometry = {path = "crates/geometry", version = "3.3.2"}
brepkit-heal = {path = "crates/heal", version = "3.3.2"}
brepkit-io = {path = "crates/io", version = "3.3.2"}
brepkit-math = {path = "crates/math", version = "3.3.2"}
brepkit-offset = {path = "crates/offset", version = "3.3.2"}
brepkit-operations = {path = "crates/operations", version = "3.3.2"}
brepkit-sketch = {path = "crates/sketch", version = "3.3.2"}
brepkit-topology = {path = "crates/topology", version = "3.3.2"}

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = {level = "deny", priority = -1}
dbg_macro = "deny"
expect_used = "warn"
nursery = {level = "warn", priority = -1}
panic = "deny"
pedantic = {level = "warn", priority = -1}
print_stderr = "deny"
print_stdout = "deny"
todo = "warn"
unwrap_used = "deny"
# Numeric/math code commonly needs these
bool_to_int_with_if = "allow"
branches_sharing_code = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
derive_partial_eq_without_eq = "allow"
doc_markdown = "allow"
if_same_then_else = "allow"
imprecise_flops = "allow"
iter_over_hash_type = "allow"
manual_let_else = "allow"
manual_slice_fill = "allow"
many_single_char_names = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_const_for_fn = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
needless_range_loop = "allow"
option_if_let_else = "allow"
redundant_else = "allow"
similar_names = "allow"
suboptimal_flops = "allow"
suspicious_operation_groupings = "allow"
too_many_lines = "allow"
tuple_array_conversions = "allow"
uninlined_format_args = "allow"
used_underscore_binding = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3

[profile.profiling]
debug = true
inherits = "release"
lto = false
opt-level = 3
