name: OSV Scan

# Complements the Dependabot cooldown: cooldown blocks fresh-but-untrusted,
# OSV blocks old-but-known-bad. Scans the npm lockfile only: Cargo.lock is
# gitignored, and Rust deps are covered by cargo-deny + rustsec in ci.yml.
# PRs are report-only; main + weekly schedule fail closed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel in-progress main/schedule scans — a rapid second push would
  # otherwise leave the older commit's lockfile unscanned.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  scan-pr:
    name: OSV Scan (report-only)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --lockfile=package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-main:
    name: OSV Scan (blocking)
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: --lockfile=package-lock.json
    permissions:
      actions: read
      contents: read
      security-events: write
