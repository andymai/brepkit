name: Release & Publish

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Manually publish this version (e.g. 0.4.1). Skips release-please."
        required: true

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    outputs:
      release_created: ${{ steps.release.outputs['release_created'] }}
      tag_name: ${{ steps.release.outputs['tag_name'] }}
      prs_created: ${{ steps.release.outputs['prs_created'] }}
      pr: ${{ steps.release.outputs['pr'] }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BREPKIT_BOT_APP_ID }}
          private-key: ${{ secrets.BREPKIT_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        # release-please can fail with "duplicate tag" (release already exists)
        # or "issue is locked" (can't comment on auto-merged PR). Both are
        # non-fatal — the release was created successfully. Publishing happens
        # independently via the release:created event trigger.
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token }}
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  auto-merge:
    name: Auto-merge Release PR
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BREPKIT_BOT_APP_ID }}
          private-key: ${{ secrets.BREPKIT_BOT_PRIVATE_KEY }}
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        run: |
          echo "Enabling auto-merge for PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --auto --squash --repo "$GITHUB_REPOSITORY"

  # Publish triggers on two events:
  # 1. release:created — release-please creates the GitHub release with the bot
  #    app token, so this event always fires (default-GITHUB_TOKEN suppression
  #    does not apply) even if release-please crashes afterward trying to
  #    comment on the locked/merged PR. The push run must NOT also publish via
  #    the release_created output: when release-please succeeds fully, both
  #    runs race the registries and the loser turns main red with
  #    already-published errors.
  # 2. workflow_dispatch — manual publish for a specific version
  publish:
    name: Build WASM & Publish
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # rust-toolchain.toml provides the pinned Rust version + wasm32 target
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.62.30
        with:
          tool: wasm-pack

      - name: Build WASM (bundler target for browsers)
        run: wasm-pack build crates/wasm --target bundler --release --out-dir pkg
        env:
          RUSTFLAGS: "-Dwarnings -C target-feature=+simd128"

      - name: Build WASM (nodejs target for Node.js/vitest)
        run: wasm-pack build crates/wasm --target nodejs --release --out-dir pkg-node
        env:
          RUSTFLAGS: "-Dwarnings -C target-feature=+simd128"

      - name: Merge dual targets into single package
        working-directory: crates/wasm
        run: |
          # Rename to .cjs so Node treats it as CommonJS even with "type": "module"
          cp pkg-node/brepkit_wasm.js pkg/brepkit_wasm_node.cjs

      - name: Set package name and exports
        working-directory: crates/wasm/pkg
        run: |
          npm pkg set name="brepkit-wasm"
          node -e '
            const pkg = require("./package.json");
            pkg.main = "brepkit_wasm_node.cjs";
            pkg.module = "brepkit_wasm.js";
            pkg.exports = {
              ".": {
                "node": "./brepkit_wasm_node.cjs",
                "import": "./brepkit_wasm.js",
                "default": "./brepkit_wasm.js"
              },
              "./brepkit_wasm_bg.wasm": "./brepkit_wasm_bg.wasm"
            };
            pkg.files = [...(pkg.files || []), "brepkit_wasm_node.cjs"];
            require("fs").writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Verify version
        working-directory: crates/wasm/pkg
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi
          echo "Publishing brepkit-wasm@$PKG_VERSION"
        env:
          TAG_NAME: ${{ github.event.release.tag_name || format('v{0}', github.event.inputs.publish_version) }}

      - name: Publish to npm (skip if already published)
        working-directory: crates/wasm/pkg
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          if npm view "brepkit-wasm@$PKG_VERSION" version 2>/dev/null; then
            echo "brepkit-wasm@$PKG_VERSION already published — skipping"
            exit 0
          fi
          npm publish --provenance --access public 2>&1 || {
            # Handle race condition: concurrent run published between our check and publish
            if npm view "brepkit-wasm@$PKG_VERSION" version 2>/dev/null; then
              echo "brepkit-wasm@$PKG_VERSION published by concurrent run — skipping"
              exit 0
            fi
            exit 1
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publishes the Rust crates. Separate from the WASM job so a crates.io outage
  # cannot block the npm release (brepjs pins the npm package, not the crates).
  publish-crates:
    name: Publish to crates.io
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: crates-io
    env:
      TAG_NAME: ${{ github.event.release.tag_name || format('v{0}', github.event.inputs.publish_version) }}
    steps:
      # Pinned to the tag rather than the default branch: a delayed
      # `release:created` event or a manual dispatch would otherwise publish
      # whatever main has advanced to instead of what was tagged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}

      # rust-toolchain.toml provides the pinned Rust version
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # Belt and braces now that the checkout is tag-pinned: catches a tag whose
      # Cargo.toml somehow disagrees with the tag name.
      - name: Verify workspace version matches the tag
        run: |
          WS_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "brepkit-math") | .version')
          if [ "$WS_VERSION" != "${TAG_NAME#v}" ]; then
            echo "::error::Version mismatch: workspace=$WS_VERSION tag=${TAG_NAME#v}"
            exit 1
          fi
          echo "Publishing brepkit crates at $WS_VERSION"

      # Trusted publishing: mints a short-lived crates.io token from the
      # workflow's OIDC identity, so there is no long-lived registry secret to
      # rotate or leak. Configured on crates.io per crate under Settings ->
      # Trusted Publishing.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # Same script a human runs to bootstrap a new crate name, so the release
      # path and the manual path cannot drift.
      - name: Publish crates (skip any already published)
        run: ./scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
